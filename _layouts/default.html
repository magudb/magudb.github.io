      {% include header.html %}
      <div id="main" class="page-fade">
        {{ content }}

      {% include footer.html %}

    <script src="{{ "/assets/js/site.js" | prepend: site.baseurl | prepend: site.url }}" defer></script>
  </body>
</html>
