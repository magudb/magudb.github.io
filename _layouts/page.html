---
layout: default
---
<article class="shell shell--grow">
  <div class="band page-band">
    <div class="band__rail page__rail">
      {%- if page.place %}
      <span class="vmark vmark--lg">{{ page.place }}</span>
      {%- endif %}
      {%- if page.contacts %}
      <div class="page__contact">
        <span class="eyebrow">Say hi</span>
        {%- for c in page.contacts %}
        <a href="{{ c.url }}"{% if c.external %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ c.label }}</a>
        {%- endfor %}
      </div>
      {%- endif %}
    </div>
    <div class="band__main page__main prose">
      <h1 class="page__title">{{ page.title }}</h1>
      {{ content }}
    </div>
  </div>
</article>
